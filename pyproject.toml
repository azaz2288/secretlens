[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretlens"
version = "0.1.0"
description = "Offline secret detection for the exact Git index, with redacted evidence"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "azaz2288"}]
dependencies = []

[project.scripts]
secretlens = "secretlens.__main__:main"

[tool.setuptools.packages.find]
include = ["secretlens*"]
